# CloudSim-Benchmark 默认配置

defaultProfile = "batch_default"

[output]
resultsDir = "runs"

[output.csv]
enabled = true
delimiter = ","

[logging]
level = "INFO"
file = true
console = true

[experiment]
autoCreateDirs = true
nameFormat = "{mode}_{timestamp}_{algorithms}"
maxConcurrent = 2

[random]
seed = 42

[optimizer]
population = 20
maxIter = 20

[profiles.batch_default]
mode = "batch"
algorithms = ["RANDOM", "PSO"]
runs = 1
outputDir = "runs/default"

[profiles.batch_default.batch]
cloudletCount = 100
population = 30
maxIter = 50

[profiles.realtime_default]
mode = "realtime"
algorithms = ["MIN_LOAD", "RANDOM"]
runs = 1
outputDir = "runs/default_realtime"

[profiles.realtime_default.realtime]
cloudletCount = 200
simulationDuration = 500.0
arrivalRate = 5.0
