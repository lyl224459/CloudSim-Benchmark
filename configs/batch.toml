# CloudSim-Benchmark 批处理模式配置

defaultProfile = "batch_compare"

[output]
resultsDir = "runs"

[output.csv]
enabled = true
delimiter = ","

[logging]
level = "INFO"
file = true
console = true

[experiment]
autoCreateDirs = true
nameFormat = "batch_{timestamp}_{algorithms}"
maxConcurrent = 4

[random]
seed = 42

[profiles.batch_compare]
mode = "batch"
algorithms = ["RANDOM", "PSO", "WOA", "GWO", "HHO"]
runs = 3
outputDir = "runs/batch_compare"

[profiles.batch_compare.batch]
cloudletCount = 100
population = 30
maxIter = 50
