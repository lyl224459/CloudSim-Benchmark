defaultProfile = "custom_batch"

[output]
resultsDir = "runs/custom_objective_test"

[random]
seed = 12345

[profiles.custom_batch]
mode = "batch"
algorithms = ["PSO", "WOA", "GWO"]
runs = 2

[profiles.custom_batch.batch]
cloudletCount = 50
population = 40
maxIter = 80
generatorType = "UNIFORM"

[profiles.custom_realtime]
mode = "realtime"
algorithms = ["MIN_LOAD", "PSO_REALTIME"]
runs = 2

[profiles.custom_realtime.realtime]
cloudletCount = 100
simulationDuration = 800.0
arrivalRate = 8.0
generatorType = "UNIFORM"
