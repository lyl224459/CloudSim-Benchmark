defaultProfile = "perf_batch"

[output]
resultsDir = "runs/performance_test"

[experiment]
nameFormat = "perf_{mode}_{timestamp}_{algorithms}"

[profiles.perf_batch]
mode = "batch"
algorithms = ["RANDOM", "PSO", "WOA", "GWO", "HHO"]
runs = 10

[profiles.perf_batch.batch]
cloudletCount = 200
population = 50
maxIter = 200

[profiles.perf_realtime]
mode = "realtime"
algorithms = ["MIN_LOAD", "RANDOM", "PSO_REALTIME", "WOA_REALTIME"]
runs = 5

[profiles.perf_realtime.realtime]
cloudletCount = 500
simulationDuration = 1000.0
arrivalRate = 10.0
