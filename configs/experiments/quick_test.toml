defaultProfile = "quick_batch"

[output]
resultsDir = "runs/quick_test"

[profiles.quick_batch]
mode = "batch"
algorithms = ["RANDOM", "PSO", "WOA"]
runs = 1

[profiles.quick_batch.batch]
cloudletCount = 20
population = 10
maxIter = 10

[profiles.quick_realtime]
mode = "realtime"
algorithms = ["MIN_LOAD", "RANDOM"]
runs = 1

[profiles.quick_realtime.realtime]
cloudletCount = 50
simulationDuration = 50.0
arrivalRate = 1.0
