# CloudSim-Benchmark 算法与预设配置

[algorithms.RANDOM]
enabled = true
description = "随机调度算法（基准）"

[algorithms.PSO]
enabled = true
description = "粒子群优化算法"
population = 30
maxIter = 100

[algorithms.WOA]
enabled = true
description = "鲸鱼优化算法"
population = 30
maxIter = 100

[algorithms.GWO]
enabled = true
description = "灰狼优化算法"
population = 30
maxIter = 100

[algorithms.HHO]
enabled = true
description = "哈里斯鹰优化算法"
population = 30
maxIter = 100

[algorithms.MIN_LOAD]
enabled = true
description = "最小负载调度算法（基准）"

[algorithms.PSO_REALTIME]
enabled = true
description = "实时粒子群优化"
population = 20
maxIter = 20

[algorithms.WOA_REALTIME]
enabled = true
description = "实时鲸鱼优化"
population = 20
maxIter = 20

[presets.quick_test]
algorithms = ["RANDOM", "PSO"]

[presets.full_batch]
algorithms = ["RANDOM", "PSO", "WOA", "GWO", "HHO", "IMPROVED_RL"]

[presets.realtime_test]
algorithms = ["MIN_LOAD", "RANDOM", "PSO_REALTIME", "WOA_REALTIME"]
