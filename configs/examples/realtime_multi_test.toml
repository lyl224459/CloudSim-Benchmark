defaultProfile = "realtime_multi_test"

[output]
resultsDir = "runs"

[output.csv]
enabled = true
delimiter = ","

[logging]
level = "INFO"
file = true
console = true

[experiment]
autoCreateDirs = true
nameFormat = "realtime_multi_{timestamp}_{algorithms}"
maxConcurrent = 4

[jvm]
maxHeapSize = "4g"
gcAlgorithm = "ZGC"

[random]
seed = 42

[profiles.realtime_multi_test]
mode = "realtime-multi"
algorithms = ["MIN_LOAD", "RANDOM", "PSO_REALTIME", "WOA_REALTIME"]
runs = 3
outputDir = "runs/realtime_multi_test"

[profiles.realtime_multi_test.realtime]
cloudletCounts = [50, 100, 200]
cloudletCount = 200
simulationDuration = 500.0
arrivalRate = 5.0
