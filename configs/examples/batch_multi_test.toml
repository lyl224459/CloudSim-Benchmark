defaultProfile = "batch_multi_test"

[output]
resultsDir = "runs"

[output.csv]
enabled = true
delimiter = ","

[logging]
level = "INFO"
file = true
console = true

[experiment]
autoCreateDirs = true
nameFormat = "batch_multi_{timestamp}_{algorithms}"
maxConcurrent = 4

[jvm]
maxHeapSize = "4g"
gcAlgorithm = "ZGC"

[random]
seed = 42

[profiles.batch_multi_test]
mode = "batch-multi"
algorithms = ["PSO", "WOA", "GWO"]
runs = 3
outputDir = "runs/batch_multi_test"

[profiles.batch_multi_test.batch]
cloudletCounts = [50, 100, 200, 500]
cloudletCount = 100
population = 30
maxIter = 50
