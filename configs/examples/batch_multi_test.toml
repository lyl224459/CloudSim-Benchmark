# 批处理多规模示例：同一算法集合在多个任务规模上重复运行。
# 可运行：.\run.cmd run --config configs/examples/batch_multi_test.toml --profile batch_multi_test

# 默认 profile。
defaultProfile = "batch_multi_test"

# 输出设置。
[output]
# 基础结果目录。
resultsDir = "runs"

[output.csv]
# 启用 CSV 输出。
enabled = true
# CSV 分隔符。
delimiter = ","

# 日志设置。
[logging]
# 常规日志级别。
level = "INFO"
# 写文件日志。
file = true
# 输出控制台日志。
console = true

# 实验运行设置。
[experiment]
# 自动创建输出目录。
autoCreateDirs = true
# multi 实验目录命名模板。
nameFormat = "batch_multi_{timestamp}_{algorithms}"
# 最大并发数。
maxConcurrent = 4

# JVM 建议参数。
[jvm]
# 多规模实验建议更大堆。
maxHeapSize = "4g"
# GC 建议。
gcAlgorithm = "ZGC"

# 随机种子。
[random]
# 固定 seed，便于比较不同任务规模。
seed = 42

# batch-multi 示例 profile。
[profiles.batch_multi_test]
# batch-multi 表示按 cloudletCounts 多任务规模运行。
mode = "batch-multi"
# 参与扩展性对比的 batch 算法。
algorithms = ["PSO", "WOA", "GWO"]
# 每个任务规模、每个算法运行次数。
runs = 3
# profile 输出目录。
outputDir = "runs/batch_multi_test"

# batch multi 参数。
[profiles.batch_multi_test.batch]
# 多规模任务数列表；multi 模式优先使用该列表。
cloudletCounts = [50, 100, 200, 500]
# 兼容单规模字段；在 batch-multi 中主要作为 fallback/参考。
cloudletCount = 100
# 元启发式算法种群大小。
population = 30
# 元启发式算法最大迭代次数。
maxIter = 50
