defaultProfile = "batch_small"

[output]
resultsDir = "runs"

[output.csv]
enabled = true
delimiter = ","

[logging]
level = "INFO"
file = true
console = true

[experiment]
autoCreateDirs = true
nameFormat = "{mode}_{timestamp}_{algorithms}"
maxConcurrent = 4

[jvm]
maxHeapSize = "4g"
gcAlgorithm = "ZGC"

[random]
seed = 42

[optimizer]
population = 20
maxIter = 20

[algorithms.PSO]
enabled = true
population = 30
maxIter = 50

[algorithms.WOA]
enabled = true
population = 25
maxIter = 40

[presets.small_scale]
algorithms = ["PSO", "WOA", "GWO"]

[presets.large_scale]
algorithms = ["PSO", "WOA", "GWO", "HHO", "IMPROVED_RL"]

[profiles.batch_small]
mode = "batch"
preset = "small_scale"
runs = 5
outputDir = "runs/batch_small"

[profiles.batch_small.batch]
cloudletCount = 100
population = 30
maxIter = 50

[profiles.realtime_smoke]
mode = "realtime"
algorithms = ["MIN_LOAD", "RANDOM"]
runs = 1
outputDir = "runs/realtime_smoke"

[profiles.realtime_smoke.realtime]
cloudletCount = 200
simulationDuration = 500.0
arrivalRate = 5.0
