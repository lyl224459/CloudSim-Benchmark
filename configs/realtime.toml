# CloudSim-Benchmark 实时调度模式配置

defaultProfile = "realtime_compare"

[output]
resultsDir = "runs"

[output.csv]
enabled = true
delimiter = ","

[logging]
level = "INFO"
file = true
console = true

[experiment]
autoCreateDirs = true
nameFormat = "realtime_{timestamp}_{algorithms}"
maxConcurrent = 4

[random]
seed = 42

[optimizer]
population = 20
maxIter = 20

[profiles.realtime_compare]
mode = "realtime"
algorithms = ["MIN_LOAD", "RANDOM", "PSO_REALTIME", "WOA_REALTIME"]
runs = 3
outputDir = "runs/realtime_compare"

[profiles.realtime_compare.realtime]
cloudletCount = 200
simulationDuration = 500.0
arrivalRate = 5.0
