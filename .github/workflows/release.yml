name: Release - Build and Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: '手动指定版本号 (例如 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  build-and-release:
    name: Build, Package and Release
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        submodules: recursive
      
    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Cache CloudSim Plus Maven dependencies
      uses: actions/cache@v5
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-m2-cloudsimplus-${{ hashFiles('gradle/cloudsimplus.lock', 'third_party/cloudsimplus/pom.xml', 'third_party/cloudsimplus/.mvn/wrapper/**') }}
        restore-keys: |
          ${{ runner.os }}-m2-cloudsimplus-

    - name: Prepare Release Version
      id: ver
      shell: bash
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          VERSION="${{ github.ref_name }}"
        fi
        VERSION=${VERSION#v}
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

    - name: Audit build warnings
      shell: pwsh
      run: ./scripts/run-build-warning-audit.ps1
      env:
        GRADLE_OPTS: "-Dfile.encoding=UTF-8"
        CI: "true"

    - name: Upload build warning audit
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: build-warning-audit-release
        path: build/reports/build-warnings/
        if-no-files-found: error

    - name: Verify buildSrc
      run: .\gradlew.bat buildSrc:check --no-daemon --stacktrace --configuration-cache
      env:
        GRADLE_OPTS: "-Dfile.encoding=UTF-8"
        CI: "true"

    - name: Generate supply chain reports
      run: |
        .\gradlew.bat generateSupplyChainReports checkLicense --no-daemon --stacktrace --no-configuration-cache "-PreleaseVersion=${{ steps.ver.outputs.version }}"
      env:
        GRADLE_OPTS: "-Dfile.encoding=UTF-8"
        CI: "true"

    - name: Build, package and smoke release assets
      run: |
        .\gradlew.bat packageReleaseAssets verifyReleaseManifest verifyReleasePackage --no-daemon --stacktrace --no-configuration-cache -Pcompress=true "-PreleaseVersion=${{ steps.ver.outputs.version }}"
        .\gradlew.bat prepareContainerImageContext verifyContainerBuildContext --no-daemon --stacktrace --configuration-cache "-PreleaseVersion=${{ steps.ver.outputs.version }}"
      env:
        GRADLE_OPTS: "-Dfile.encoding=UTF-8"
        CI: "true"

    - name: Upload minimal container context
      uses: actions/upload-artifact@v7
      with:
        name: release-container-context
        path: build/container-context/
        if-no-files-found: error

    - name: Upload container SBOM
      uses: actions/upload-artifact@v7
      with:
        name: release-container-sbom
        path: build/release-artifacts/cloudsim-benchmark-${{ steps.ver.outputs.version }}-sbom.json
        if-no-files-found: error

    - name: Attest release assets
      uses: actions/attest@v4
      with:
        subject-path: build/release-artifacts/*

    - name: Attest executable JAR with SBOM
      uses: actions/attest@v4
      with:
        subject-path: build/release-artifacts/cloudsim-benchmark-${{ steps.ver.outputs.version }}.jar
        sbom-path: build/release-artifacts/cloudsim-benchmark-${{ steps.ver.outputs.version }}-sbom.json

    - name: Build release notes from changelog
      shell: pwsh
      run: |
        $version = "${{ steps.ver.outputs.version }}"
        $lines = Get-Content CHANGELOG.md
        $headingPattern = "^##\s+$([regex]::Escape($version))\b"
        $heading = $lines | Select-String -Pattern $headingPattern | Select-Object -First 1
        if (-not $heading) {
          throw "CHANGELOG.md does not contain a release section for $version"
        }
        $start = $heading.LineNumber - 1
        $next = $null
        for ($i = $start + 1; $i -lt $lines.Count; $i++) {
          if ($lines[$i] -match '^##\s+') {
            $next = $i
            break
          }
        }
        if ($null -eq $next) {
          $section = $lines[$start..($lines.Count - 1)]
        } else {
          $section = $lines[$start..($next - 1)]
        }
        $notes = @(
          "# CloudSim-Benchmark v$version",
          "",
          "以下内容来自 CHANGELOG.md。",
          ""
        ) + $section
        Set-Content -Path release-notes.md -Encoding UTF8 -Value $notes

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ steps.ver.outputs.tag }}
        name: CloudSim-Benchmark v${{ steps.ver.outputs.version }}
        body_path: release-notes.md
        draft: false
        prerelease: false
        files: |
          build/release-artifacts/*.jar
          build/release-artifacts/*.zip
          build/release-artifacts/*.tar.gz
          build/release-artifacts/*.txt
          build/release-artifacts/*.json
          build/release-artifacts/*.html
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-podman:
    name: Build and Push Podman Image
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
    - name: Download minimal container context
      uses: actions/download-artifact@v8
      with:
        name: release-container-context
        path: build/container-context

    - name: Download container SBOM
      uses: actions/download-artifact@v8
      with:
        name: release-container-sbom
        path: build/supply-chain

    - name: Install Podman
      run: |
        sudo apt-get update
        sudo apt-get install -y podman
        podman --version

    - name: Log in to GHCR with Podman
      run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

    - name: Configure GHCR credentials for attestations
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "${HOME}/.docker"
        auth="$(printf '%s:%s' "${GITHUB_ACTOR}" "${GITHUB_TOKEN}" | base64 -w 0)"
        printf '{"auths":{"ghcr.io":{"auth":"%s"}}}\n' "${auth}" > "${HOME}/.docker/config.json"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push OCI image with Podman
      id: push
      run: |
        set -euo pipefail
        image="ghcr.io/lyl224459/cloudsim-benchmark"
        version="${{ needs.build-and-release.outputs.version }}"
        version_tag="${image}:${version}"

        podman build --format oci -t "${version_tag}" -f build/container-context/Containerfile build/container-context
        podman push --digestfile image-digest.txt "${version_tag}"

        if { [ "${GITHUB_EVENT_NAME}" = "push" ] && [[ "${GITHUB_REF}" == refs/tags/v* ]]; } ||
           { [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; }; then
          podman tag "${version_tag}" "${image}:latest"
          podman push "${image}:latest"
        fi

        digest="$(cat image-digest.txt)"
        echo "digest=${digest}" >> "$GITHUB_OUTPUT"

    - name: Attest container image provenance
      uses: actions/attest@v4
      with:
        subject-name: ghcr.io/lyl224459/cloudsim-benchmark
        subject-digest: ${{ steps.push.outputs.digest }}
        push-to-registry: true
        create-storage-record: false

    - name: Attest container image SBOM
      uses: actions/attest@v4
      with:
        subject-name: ghcr.io/lyl224459/cloudsim-benchmark
        subject-digest: ${{ steps.push.outputs.digest }}
        sbom-path: build/supply-chain/cloudsim-benchmark-${{ needs.build-and-release.outputs.version }}-sbom.json
        push-to-registry: true
        create-storage-record: false
