name: Release - Build and Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: '手动指定版本号 (例如 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    name: Build, Package and Release
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive
      
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Prepare Release Version
      id: ver
      shell: bash
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          VERSION="${{ github.ref_name }}"
        fi
        VERSION=${VERSION#v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "tag=v$VERSION" >> $GITHUB_OUTPUT

    - name: Build, package and smoke release assets
      run: |
        .\gradlew.bat clean sanitizeCloudSimPlusJarManifest --no-daemon --stacktrace --no-configuration-cache
        .\gradlew.bat packageReleaseAssets verifyReleasePackage --no-daemon --stacktrace --no-configuration-cache -Pcompress=true -PreleaseVersion=${{ steps.ver.outputs.version }}
      env:
        GRADLE_OPTS: "-Dfile.encoding=UTF-8"
        CI: "true"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.ver.outputs.tag }}
        name: CloudSim-Benchmark v${{ steps.ver.outputs.version }}
        body: |
          ## 🚀 CloudSim-Benchmark ${{ steps.ver.outputs.tag }} 发布
          
          ### 📦 包含产物
          - **Executable JAR**: 包含所有依赖，直接通过 `java -jar` 运行。
          - **Windows Package**: 包含便捷运行脚本和默认配置。
          - **Unix Package**: 包含 `scripts/run`、默认配置和日志配置。
          - **Source Code**: 完整开发环境源码。
          
          ### 🛠️ 运行环境
          - JDK 25+ (推荐)
          
          ### 🐳 容器镜像
          本版本已同步发布至 GitHub Container Registry:
          `ghcr.io/${{ github.repository_owner }}/cloudsim-benchmark:${{ steps.ver.outputs.version }}`
        draft: false
        prerelease: false
        files: |
          build/release-artifacts/*.jar
          build/release-artifacts/*.zip
          build/release-artifacts/*.tar.gz
          build/release-artifacts/*.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-docker:
    name: Build and Push Docker Image
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=semver,pattern={{version}}
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Containerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
