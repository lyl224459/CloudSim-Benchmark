name: Release - Build and Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: '手动指定版本号 (例如 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  build-and-release:
    name: Build, Package and Release
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        submodules: recursive
      
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Cache CloudSim Plus Maven dependencies
      uses: actions/cache@v5
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-m2-cloudsimplus-${{ hashFiles('gradle/cloudsimplus.lock', 'third_party/cloudsimplus/pom.xml', 'third_party/cloudsimplus/.mvn/wrapper/**') }}
        restore-keys: |
          ${{ runner.os }}-m2-cloudsimplus-

    - name: Prepare Release Version
      id: ver
      shell: bash
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          VERSION="${{ github.ref_name }}"
        fi
        VERSION=${VERSION#v}
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

    - name: Audit build warnings
      shell: pwsh
      run: ./scripts/run-build-warning-audit.ps1
      env:
        GRADLE_OPTS: "-Dfile.encoding=UTF-8"
        CI: "true"

    - name: Upload build warning audit
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: build-warning-audit-release
        path: build/reports/build-warnings/
        if-no-files-found: error

    - name: Verify buildSrc
      run: .\gradlew.bat buildSrc:check --no-daemon --stacktrace --configuration-cache
      env:
        GRADLE_OPTS: "-Dfile.encoding=UTF-8"
        CI: "true"

    - name: Generate supply chain reports
      run: |
        .\gradlew.bat generateSupplyChainReports checkLicense --no-daemon --stacktrace --no-configuration-cache -PreleaseVersion=${{ steps.ver.outputs.version }}
      env:
        GRADLE_OPTS: "-Dfile.encoding=UTF-8"
        CI: "true"

    - name: Build, package and smoke release assets
      run: |
        .\gradlew.bat packageReleaseAssets verifyReleaseManifest verifyReleasePackage --no-daemon --stacktrace --no-configuration-cache -Pcompress=true -PreleaseVersion=${{ steps.ver.outputs.version }}
        .\gradlew.bat prepareContainerImageContext verifyContainerBuildContext --no-daemon --stacktrace --configuration-cache -PreleaseVersion=${{ steps.ver.outputs.version }}
      env:
        GRADLE_OPTS: "-Dfile.encoding=UTF-8"
        CI: "true"

    - name: Upload minimal container context
      uses: actions/upload-artifact@v7
      with:
        name: release-container-context
        path: build/container-context/
        if-no-files-found: error

    - name: Upload container SBOM
      uses: actions/upload-artifact@v7
      with:
        name: release-container-sbom
        path: build/release-artifacts/cloudsim-benchmark-${{ steps.ver.outputs.version }}-sbom.json
        if-no-files-found: error

    - name: Attest release assets
      uses: actions/attest@v4
      with:
        subject-path: build/release-artifacts/*

    - name: Attest executable JAR with SBOM
      uses: actions/attest@v4
      with:
        subject-path: build/release-artifacts/cloudsim-benchmark-${{ steps.ver.outputs.version }}.jar
        sbom-path: build/release-artifacts/cloudsim-benchmark-${{ steps.ver.outputs.version }}-sbom.json

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ steps.ver.outputs.tag }}
        name: CloudSim-Benchmark v${{ steps.ver.outputs.version }}
        body: |
          ## 🚀 CloudSim-Benchmark ${{ steps.ver.outputs.tag }} 发布
          
          ### 📦 包含产物
          - **Executable JAR**: 包含所有依赖，直接通过 `java -jar` 运行。
          - **Windows Package**: 包含便捷运行脚本和默认配置。
          - **Unix Package**: 包含 `scripts/run`、默认配置和日志配置。
          - **Source Code**: 完整开发环境源码。
          
          ### 🛠️ 运行环境
          - JDK 25+ (推荐)
          
          ### 🐳 容器镜像
          本版本已同步发布至 GitHub Container Registry:
          `ghcr.io/${{ github.repository_owner }}/cloudsim-benchmark:${{ steps.ver.outputs.version }}`
        draft: false
        prerelease: false
        files: |
          build/release-artifacts/*.jar
          build/release-artifacts/*.zip
          build/release-artifacts/*.tar.gz
          build/release-artifacts/*.txt
          build/release-artifacts/*.json
          build/release-artifacts/*.html
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-docker:
    name: Build and Push Docker Image
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
    - name: Download minimal container context
      uses: actions/download-artifact@v8
      with:
        name: release-container-context
        path: build/container-context

    - name: Download container SBOM
      uses: actions/download-artifact@v8
      with:
        name: release-container-sbom
        path: build/supply-chain

    - name: Log in to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/lyl224459/cloudsim-benchmark
        tags: |
          type=semver,pattern={{version}}
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

    - name: Build and push Docker image
      id: push
      uses: docker/build-push-action@v7
      with:
        context: build/container-context
        file: build/container-context/Containerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=release-image
        cache-to: type=gha,mode=max,scope=release-image

    - name: Attest container image provenance
      uses: actions/attest@v4
      with:
        subject-name: ghcr.io/lyl224459/cloudsim-benchmark
        subject-digest: ${{ steps.push.outputs.digest }}
        push-to-registry: true

    - name: Attest container image SBOM
      uses: actions/attest@v4
      with:
        subject-name: ghcr.io/lyl224459/cloudsim-benchmark
        subject-digest: ${{ steps.push.outputs.digest }}
        sbom-path: build/supply-chain/cloudsim-benchmark-${{ needs.build-and-release.outputs.version }}-sbom.json
        push-to-registry: true
