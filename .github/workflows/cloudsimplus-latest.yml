name: CloudSim Plus Latest Compatibility

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest-release:
    name: Latest CloudSim Plus (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Cache CloudSim Plus Maven dependencies
      uses: actions/cache@v5
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-m2-cloudsimplus-${{ hashFiles('gradle/cloudsimplus.lock', 'third_party/cloudsimplus/pom.xml', 'third_party/cloudsimplus/.mvn/wrapper/**') }}
        restore-keys: |
          ${{ runner.os }}-m2-cloudsimplus-

    - name: Test latest release (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        .\gradlew.bat verifyCloudSimPlusSourceBuild fullCheck benchmarkPerformanceSmoke --no-daemon --stacktrace --configuration-cache -Pcloudsimplus.autoUpdate=true
      env:
        GRADLE_OPTS: "-Dfile.encoding=UTF-8"
        CI: "true"

    - name: Test latest release (Unix)
      if: runner.os != 'Windows'
      run: |
        ./gradlew verifyCloudSimPlusSourceBuild fullCheck benchmarkPerformanceSmoke --no-daemon --stacktrace --configuration-cache -Pcloudsimplus.autoUpdate=true
      env:
        GRADLE_OPTS: "-Dfile.encoding=UTF-8"
        CI: "true"

    - name: Upload compatibility metadata and reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: cloudsimplus-latest-${{ matrix.os }}
        path: |
          build/cloudsimplus-mutable-version.txt
          build/reports/
        if-no-files-found: warn
