name: CI - Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  workflow-static-analysis:
    name: Workflow static analysis
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Run actionlint
      run: docker run --rm -v "${{ github.workspace }}:/repo" -w /repo rhysd/actionlint:1.7.7

  supply-chain-policy:
    name: Supply chain policy
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Cache CloudSim Plus Maven dependencies
      uses: actions/cache@v5
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-m2-cloudsimplus-${{ hashFiles('gradle/cloudsimplus.lock', 'third_party/cloudsimplus/pom.xml', 'third_party/cloudsimplus/.mvn/wrapper/**') }}
        restore-keys: |
          ${{ runner.os }}-m2-cloudsimplus-

    - name: Verify runtime licenses and supply chain reports
      run: ./gradlew generateSupplyChainReports checkLicense --no-daemon --stacktrace --no-configuration-cache
      env:
        GRADLE_OPTS: "-Dfile.encoding=UTF-8"
        CI: "true"

    - name: Upload supply chain policy reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: supply-chain-policy
        path: build/reports/supply-chain/
        if-no-files-found: error

  build-test-package:
    name: Full check and package smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Cache CloudSim Plus Maven dependencies
      uses: actions/cache@v5
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-m2-cloudsimplus-${{ hashFiles('gradle/cloudsimplus.lock', 'third_party/cloudsimplus/pom.xml', 'third_party/cloudsimplus/.mvn/wrapper/**') }}
        restore-keys: |
          ${{ runner.os }}-m2-cloudsimplus-

    - name: Audit build warnings
      shell: pwsh
      run: ./scripts/run-build-warning-audit.ps1
      env:
        GRADLE_OPTS: "-Dfile.encoding=UTF-8"
        CI: "true"

    - name: Upload build warning audit
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: build-warning-audit-${{ matrix.os }}
        path: build/reports/build-warnings/
        if-no-files-found: error

    - name: Full check and release package smoke (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        .\gradlew.bat fullCheck verifyReleasePackage --no-daemon --stacktrace --configuration-cache
      env:
        GRADLE_OPTS: "-Dfile.encoding=UTF-8"
        CI: "true"

    - name: Full check and release package smoke (Unix)
      if: runner.os != 'Windows'
      run: |
        ./gradlew fullCheck verifyReleasePackage --no-daemon --stacktrace --configuration-cache
      env:
        GRADLE_OPTS: "-Dfile.encoding=UTF-8"
        CI: "true"

  buildsrc-unit:
    name: BuildSrc unit tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Run buildSrc unit tests
      run: ./gradlew buildSrc:unitTest --no-daemon --stacktrace --configuration-cache
      env:
        GRADLE_OPTS: "-Dfile.encoding=UTF-8"
        CI: "true"

    - name: Upload buildSrc unit coverage
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: buildsrc-coverage-unit
        path: buildSrc/build/jacoco/
        if-no-files-found: error

  buildsrc-functional:
    name: BuildSrc ${{ matrix.shard }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]
        shard: [ cloudSimPlusFunctionalTest, verificationFunctionalTest, containerFunctionalTest ]

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Run buildSrc functional shard
      shell: pwsh
      run: |
        if ($IsWindows) {
          .\gradlew.bat buildSrc:${{ matrix.shard }} --no-daemon --stacktrace --configuration-cache
        } else {
          ./gradlew buildSrc:${{ matrix.shard }} --no-daemon --stacktrace --configuration-cache
        }
      env:
        GRADLE_OPTS: "-Dfile.encoding=UTF-8"
        CI: "true"

    - name: Upload buildSrc functional coverage
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: buildsrc-coverage-${{ matrix.shard }}-${{ matrix.os }}
        path: buildSrc/build/jacoco/
        if-no-files-found: error

  buildsrc-coverage:
    name: BuildSrc aggregate coverage
    needs: [ buildsrc-unit, buildsrc-functional ]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Download buildSrc coverage data
      uses: actions/download-artifact@v8
      with:
        pattern: buildsrc-coverage-*
        path: buildSrc/build/jacoco/ci
        merge-multiple: false

    - name: Generate merged buildSrc JaCoCo report
      run: |
        ./gradlew buildSrc:jacocoTestReport buildSrc:jacocoTestCoverageVerification -x buildSrc:test --no-daemon --stacktrace

    - name: Upload merged buildSrc JaCoCo report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: buildsrc-jacoco
        path: buildSrc/build/reports/jacoco/
        if-no-files-found: error

  container-smoke:
    name: Container image smoke
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Cache CloudSim Plus Maven dependencies
      uses: actions/cache@v5
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-m2-cloudsimplus-${{ hashFiles('gradle/cloudsimplus.lock', 'third_party/cloudsimplus/pom.xml', 'third_party/cloudsimplus/.mvn/wrapper/**') }}
        restore-keys: |
          ${{ runner.os }}-m2-cloudsimplus-

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build and smoke container image
      run: |
        ./gradlew sanitizeCloudSimPlusJarManifest --no-daemon --stacktrace --configuration-cache
        ./gradlew containerImageSmoke --no-daemon --stacktrace --configuration-cache
      env:
        GRADLE_OPTS: "-Dfile.encoding=UTF-8"
        CI: "true"

  performance-trend:
    name: Non-blocking performance trend
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Cache CloudSim Plus Maven dependencies
      uses: actions/cache@v5
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-m2-cloudsimplus-${{ hashFiles('gradle/cloudsimplus.lock', 'third_party/cloudsimplus/pom.xml', 'third_party/cloudsimplus/.mvn/wrapper/**') }}
        restore-keys: |
          ${{ runner.os }}-m2-cloudsimplus-

    - name: Load hosted-runner performance baseline
      shell: bash
      run: |
        mkdir -p build/reports/performance
        git fetch origin performance-history:refs/remotes/origin/performance-history || true
        git show origin/performance-history:jmh-results.json \
          > build/reports/performance/previous-jmh-results.json 2>/dev/null || \
          rm -f build/reports/performance/previous-jmh-results.json

    - name: Generate JMH trend report
      shell: bash
      run: |
        ./gradlew sanitizeCloudSimPlusJarManifest --no-daemon --stacktrace --configuration-cache
        args=(benchmarkPerformanceTrend --no-daemon --stacktrace --configuration-cache)
        if test -s build/reports/performance/previous-jmh-results.json; then
          args+=("-PperformanceBaseline=build/reports/performance/previous-jmh-results.json")
        fi
        ./gradlew "${args[@]}"
      env:
        GRADLE_OPTS: "-Dfile.encoding=UTF-8"
        CI: "true"

    - name: Upload performance trend artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: performance-trend
        path: |
          build/reports/performance/jmh-results.json
          build/reports/performance/performance-trend.md
          build/reports/performance/previous-jmh-results.json
        if-no-files-found: warn
